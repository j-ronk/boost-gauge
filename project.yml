name: Vitals
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  Vitals:
    type: application
    platform: macOS
    sources:
      - path: Sources/Vitals
    postCompileScripts:
      # SMAppService finds the daemon by this file name, so it carries the helper's bundle ID.
      - name: Install launchd plist
        inputFiles:
          - $(SRCROOT)/Sources/VitalsHelper/Helper.launchd.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/${VITALS_APP_BUNDLE_ID}.Helper.plist
        script: |
          set -euo pipefail
          if ! printf '%s' "$VITALS_APP_BUNDLE_ID" | grep -Eqx '[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*'; then
            echo "error: VITALS_BUNDLE_PREFIX must be a plain reverse-DNS prefix (Config/Signing.local.xcconfig)" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          sed -e 's/[$][{]VITALS_APP_BUNDLE_ID[}]/'"$VITALS_APP_BUNDLE_ID"'/g' "$SCRIPT_INPUT_FILE_0" > "$SCRIPT_OUTPUT_FILE_0"
          plutil -lint -s "$SCRIPT_OUTPUT_FILE_0"
    dependencies:
      - target: VitalsKit
        embed: true
      - target: VitalsHelper
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VITALS_APP_BUNDLE_ID)
        PRODUCT_NAME: Vitals
        INFOPLIST_FILE: Config/Identity-Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vitals
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  VitalsKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/VitalsKit
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VITALS_BUNDLE_PREFIX).VitalsKit
        PRODUCT_NAME: VitalsKit
        SKIP_INSTALL: YES
  VitalsHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/VitalsHelper
        excludes:
          - "*.plist"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VITALS_APP_BUNDLE_ID).Helper
        PRODUCT_NAME: VitalsHelper
        INFOPLIST_FILE: Config/Identity-Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
  VitalsKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VitalsKitTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: VitalsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VITALS_BUNDLE_PREFIX).VitalsKitTests
        # xctest is Apple-signed; hardened runtime library validation would refuse a team-signed bundle.
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Vitals:
    build:
      targets:
        Vitals: all
    run:
      config: Debug
  VitalsKitTests:
    build:
      targets:
        VitalsKitTests: [test]
    test:
      config: Debug
      targets:
        - VitalsKitTests
