name: BoostGauge
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  BoostGauge:
    type: application
    platform: macOS
    sources:
      - path: Sources/BoostGauge
    postCompileScripts:
      # SMAppService finds the daemon by this file name, so it carries the helper's bundle ID.
      - name: Install launchd plist
        inputFiles:
          - $(SRCROOT)/Sources/BoostGaugeHelper/Helper.launchd.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/${BOOSTGAUGE_APP_BUNDLE_ID}.Helper.plist
        script: |
          set -euo pipefail
          if ! printf '%s' "$BOOSTGAUGE_APP_BUNDLE_ID" | grep -Eqx '[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*'; then
            echo "error: BOOSTGAUGE_BUNDLE_PREFIX must be a plain reverse-DNS prefix (Config/Signing.local.xcconfig)" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          sed -e 's/[$][{]BOOSTGAUGE_APP_BUNDLE_ID[}]/'"$BOOSTGAUGE_APP_BUNDLE_ID"'/g' "$SCRIPT_INPUT_FILE_0" > "$SCRIPT_OUTPUT_FILE_0"
          plutil -lint -s "$SCRIPT_OUTPUT_FILE_0"
    dependencies:
      - target: BoostGaugeKit
        embed: true
      - target: BoostGaugeHelper
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOSTGAUGE_APP_BUNDLE_ID)
        PRODUCT_NAME: BoostGauge
        INFOPLIST_FILE: Config/Identity-Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Boost Gauge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  BoostGaugeKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/BoostGaugeKit
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOSTGAUGE_BUNDLE_PREFIX).BoostGaugeKit
        PRODUCT_NAME: BoostGaugeKit
        SKIP_INSTALL: YES
  BoostGaugeHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/BoostGaugeHelper
        excludes:
          - "*.plist"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOSTGAUGE_APP_BUNDLE_ID).Helper
        PRODUCT_NAME: BoostGaugeHelper
        INFOPLIST_FILE: Config/Identity-Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
  BoostGaugeKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BoostGaugeKitTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: BoostGaugeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOSTGAUGE_BUNDLE_PREFIX).BoostGaugeKitTests
        # xctest is Apple-signed; hardened runtime library validation would refuse a team-signed bundle.
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  BoostGauge:
    build:
      targets:
        BoostGauge: all
    run:
      config: Debug
  BoostGaugeKitTests:
    build:
      targets:
        BoostGaugeKitTests: [test]
    test:
      config: Debug
      targets:
        - BoostGaugeKitTests
